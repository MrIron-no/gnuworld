# GNUWorld logging configuration
#
# This file says WHERE log records are written (the sinks) and WHICH records
# each destination gets (the loggers).  Copy it to logging.conf in the
# directory GNUWorld is started from, or point the "logging_conf" key of
# GNUWorld.conf at it.
#
# The file is OPTIONAL.  With no logging.conf at all GNUWorld behaves as it
# always did: a human-readable debug.log plus, in verbose mode, the terminal.
#
# It is re-read on SIGHUP, together with the log rotation that signal does:
# every sink reopens its file, then this file is read again, so a change here
# takes effect without a restart.  A file that cannot be read or that has a
# mistake in it is reported as ERROR records on the logger "core.config" and
# then ignored: the configuration in force stays in force, and a broken file
# can neither stop nor silence a running process.
#
# GNUWorld does NOT rotate its own log files.  Rotation is external: let
# logrotate (or whatever else) move the files away and send GNUWorld a SIGHUP,
# and the next record lands in a fresh file.  A logrotate stanza is no more
# than
#
#   /path/to/gnuworld/*.log {
#       daily
#       rotate 14
#       compress
#       missingok
#       notifempty
#       sharedscripts
#       postrotate
#           kill -HUP $(cat /path/to/gnuworld/gnuworld.pid)
#       endscript
#   }
#
#################################################################
# Syntax
#
# The syntax is the usual "key = value" of every GNUWorld conf file; '#'
# starts a comment, and a comment has a line of its own.
#
#   sink.<id>.type      = file | console | irc | pushover
#                         What kind of destination this is.  Required.
#                         "pushover" is a pager and has settings of its own,
#                         listed with the section at the end of this file; a
#                         build without libcurl has no pushover sink and
#                         refuses a file that names one.  (prometheus is not a
#                         kind of sink this file names: cservice attaches its
#                         metrics exporter in code.)
#   sink.<id>.path      = <file name>
#                         file only, required.  Relative to the directory
#                         GNUWorld runs in, like every other file name.  The
#                         file is appended to, never truncated.
#   sink.<id>.format    = json | text
#                         file only: default json.  A console and a channel
#                         are read by a human and are always text.
#   sink.<id>.level     = OFF | FATAL | ERROR | WARN | INFO | DEBUG | TRACE
#                         The least important record this sink still writes.
#                         Default TRACE, which is everything it is given.
#   sink.<id>.colour    = auto | yes | no
#                         console only, default auto: colour when the output
#                         really is a terminal and NO_COLOR is not set.
#   sink.<id>.channel   = #channel
#                         irc only, required.  Records are sent there as
#                         server notices, and are dropped for as long as
#                         GNUWorld is not connected or the channel is empty.
#   sink.<id>.highlight = yes | no
#                         console and irc, default yes: the values
#                         substituted into a message are shown in bold.
#   sink.<id>.rate      = <N>/min | <N>/hour | <N>/sec
#                         irc only, optional.  Without it a channel sink sends
#                         every record it is given, which is what it has always
#                         done.  With it at most N RECORDS a period are sent
#                         (however many lines each of them is), the rest are
#                         dropped and counted, and the next record that does go
#                         out is preceded by one notice saying how many did not.
#                         A pushover sink has a rate too, and one by default:
#                         see the section at the end of this file.
#
#   logger.<dotted.name> = LEVEL[, <sink id>[, <sink id> ...]]
#                         The level this logger records at, and the sinks its
#                         records go to.  The root logger is written "root".
#   additivity.<dotted.name> = yes | no
#                         Default yes.  See below.
#
# An <id> is letters, digits, '_' and '-'.  Levels, sink types and yes/no
# values may be written in any case; a logger name is read exactly as spelt.
#
#################################################################
# Inheritance, additive sinks, and the threshold of a sink
#
# Logger names are a hierarchy: "cservice.sql" sits below "cservice", which
# sits below the root.  A logger with no level of its own has the level of the
# nearest ancestor that has one, so "logger.root = INFO" is the level of
# everything, and one line about one logger is enough to raise or lower that
# part of the tree.
#
# Sinks are ADDITIVE: a record logged on "cservice.sql" goes to the sinks of
# "cservice.sql", and then to those of "cservice", and then to those of the
# root.  "additivity.<name> = no" stops that walk after that logger, which is
# how one logger is sent to a file of its own and nowhere else.
#
# Each sink has a threshold of its own on top of all that: a logger at DEBUG
# feeding a sink at WARN writes the DEBUG records to its other sinks and only
# the warnings and worse to that one.
#
#################################################################
# The loggers there are
#
#   root            everything, the ancestor of all of the below
#   legacy          every line still written through the old elog stream
#   core            the server itself: xServer, main, the timers
#   core.net        the connection layer
#   core.proto      the protocol layer: one record per message is TRACE
#   core.state      the network state: clients, servers, channels
#   core.config     the configuration files, this one included
#   core.modules    loading, attaching and unloading modules
#
# and one logger per module, named after its library file - libcservice.la is
# "cservice" - which is the logger the module's own LOG statements write to:
#
#   cservice  ccontrol  chanfix  dronescan  nickserv  cloner  gnutest  ...
#
# Every module that talks to a database also has "<module>.sql" below it -
# cservice.sql, ccontrol.sql, chanfix.sql, dronescan.sql, nickserv.sql - whose
# code default is ERROR: failed queries are logged, successful ones are not.
# DEBUG on such a logger logs every query the module sends.
#
# cservice has one more of its own:
#
#   cservice.commands   one record per command a user sends; the sentence names
#                       the command and the nick, the arguments are in the JSON
#                       field command_line
#
#################################################################
# The two command line switches
#
# The sink id "debuglog" is special, because it is the file the -d and -D
# switches have always been about:
#
#   -d <file>   the sink with the id "debuglog" writes to <file> instead of
#               the path given here
#   -D          the sink with the id "debuglog" is removed altogether, and
#               with it every mention of it in a logger line - "no debug log"
#               keeps meaning no debug log
#
# Nothing else here is touched by the command line.  The terminal is written
# to only in verbose mode (-c), whether a console sink is configured or not.
#
#################################################################
# The configuration

# The terminal GNUWorld was started from, in verbose mode
sink.console.type = console

# The human-readable log file the -d and -D switches are about
sink.debuglog.type = file
sink.debuglog.path = debug.log
sink.debuglog.format = text

# One JSON record per line, for a log shipper to read
sink.main.type = file
sink.main.path = gnuworld.log
sink.main.format = json

# Everything at INFO and above, to all three
logger.root = INFO, debuglog, console, main

# The old elog stream of the modules that have not moved to the logger yet.
# A switch, on or off, and not a level: an elog line says nothing of how bad it
# is, so every one of them is a DEBUG record, and a sink shows them only if its
# own sink.<id>.level lets DEBUG through.
logger.legacy = on

# The server itself
logger.core = INFO

#################################################################
# cservice
#
# cservice is configured here like every other logger.  What follows is the
# whole of it, and is what cservice used to do with logging keys of its own:
# a JSON file of its own, the debug channel, and the console.

# The module's own JSON log file, one object per line
sink.cservice.type     = file
sink.cservice.path     = cservice.log
sink.cservice.format   = json

# The channel the log is mirrored to.  This should be the channel cservice's
# own "debug_channel" names (cservice.conf: #coder-com as it ships).  The
# notices are sent as the server, so the channel needs no client in it;
# records logged while GNUWorld is not connected are dropped rather than
# queued for ever.  At INFO, so that the DEBUG records of the logger below -
# every SQL statement among them - never reach a channel.
sink.debugchan.type    = irc
sink.debugchan.channel = #coder-com
sink.debugchan.level   = INFO

# cservice at DEBUG, to all three.  "additivity = no" keeps its records out
# of the root's sinks above: drop that line to have them in debug.log and
# gnuworld.log as well.
logger.cservice              = DEBUG, cservice, debugchan, console
additivity.cservice          = no

# The command log, one record per command a user sends X, to the file only:
# its sentence ("LOGIN by nick") is noise on a channel, and its arguments are
# the JSON field command_line, which is not for a channel at all.
logger.cservice.commands     = INFO, cservice
additivity.cservice.commands = no

# Every SQL statement cservice sends, in full.  Without this line cservice.sql
# reports the statements that FAIL and nothing else, which is what is wanted on
# a production install; see Security below before turning it on.
#logger.cservice.sql         = DEBUG

# A module that is not loaded simply never logs to its loggers, so all of the
# above is harmless in a GNUWorld running without cservice - except that every
# file sink of this file is opened at start-up, referenced or not, so an empty
# cservice.log appears.  Drop the section if cservice is not loaded.

#################################################################
# A pager: the pushover sink
#
# Pushover (https://pushover.net/) is a THIRD-PARTY notification service: this
# sink makes one HTTPS request per record per user key to its API.  Only the
# rendered sentence and the title ("[core.net] FATAL") ever leave this host -
# no fields, no context, no query - but that sentence leaves it, so put a pager
# on the records that are worth waking somebody for and on no others.
#
# To use it, create an application on pushover.net for the token, and take the
# user key of every person to be paged.
#
#   sink.<id>.type    = pushover
#   sink.<id>.token   = <the application token>      required
#   sink.<id>.userkey = <key>[, <key> ...]           required, one request each
#   sink.<id>.level   = ERROR                        default ERROR, not TRACE
#   sink.<id>.rate    = 10/min                       default 10/min
#   sink.<id>.url     = <endpoint>                   default the real service
#
# The DEFAULT LEVEL of this kind of sink is ERROR and not TRACE: a pager is
# opt-in for anything chattier than that, and "level = INFO" on a sink attached
# to the root is a notification per module load.
#
# The RATE LIMIT is 10/min unless this file says otherwise.  Beyond it a
# notification is dropped and counted, and the next one that does go out is
# preceded by one saying "<N> messages were suppressed by the rate limit of
# 10/min": a flood costs a handful of notifications, not a thousand.
#
# A LOOP is impossible: this sink's own delivery failures are logged on
# "core.notifier", and a record of that logger - or of anything below it - is
# never paged, so a pushover sink on the ROOT cannot page about failing to page.
# Those failures are themselves logged at most once a minute per sink.
#
# THIS FILE THEN HOLDS A SECRET.  chmod 600 logging.conf: the token is a
# credential, and GNUWorld says so once at WARN on "core.config" if the file is
# readable by its group or by the world.  Nothing in a log record or in an error
# message about this file ever contains the token or a user key - a record about
# a user names its position in the list, "user #1".
#
# "url" exists so that a test can point the sink at a local endpoint; http:// is
# allowed for that reason.  Leave it out to reach the real service.
#
#sink.page.type    = pushover
#sink.page.token   = aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
#sink.page.userkey = uuuuuuuuuuuuuuuuuuuuuuuuuuuuuu
#sink.page.level   = ERROR
#sink.page.rate    = 10/min

# Attached to the root, which is where the records worth a page are - a FATAL
# of "core" or "core.net", and the failures of every module:
#logger.root = INFO, debuglog, console, main, page

# Or to one module's logger alone, which is what cservice used to do with its
# own pushover_* keys:
#logger.cservice = DEBUG, cservice, debugchan, console, page

#################################################################
# Examples, for copying rather than for using as they stand

# Every protocol message, which is a great deal of output
#logger.core.proto = TRACE

# The command log in a file of its own rather than in cservice.log
#sink.commandlog.type = file
#sink.commandlog.path = cservice-commands.log
#sink.commandlog.format = json
#logger.cservice.commands = INFO, commandlog
#additivity.cservice.commands = no

# An audit trail of its own: one logger to one file, and nowhere else.  The
# "additivity = no" is what keeps these records out of the files above.
#sink.spamaudit.type = file
#sink.spamaudit.path = dronescan-spam.log
#sink.spamaudit.format = json
#logger.dronescan.spam.action = INFO, spamaudit
#additivity.dronescan.spam.action = no

#################################################################
# Security
#
# A JSON sink is the whole record: client IPs, accounts, user@host, a
# cservice command line, and the query of a failed SQL statement.  cservice
# keeps its own credential-bearing statements out of that (it calls
# Exec(query, false) for the two that set a password hash, a TOTP key or a
# SCRAM record); no other module's queries are reviewed for what they may
# contain.  Treat a JSON log as sensitive, especially once it is shipped to a
# log stack outside this host.
#
# A log file this process creates is 0640; a file that is already there keeps
# whatever mode it had, and a file sink follows a symlink rather than
# refusing one.  The directory a log lives in has to be writable by nobody
# but GNUWorld's own user.
#
# "logger.<module>.sql = DEBUG" logs every statement in full - for cservice
# and ccontrol that includes the UPDATE that sets a password.  Never route
# such a logger, at DEBUG, to an irc sink or to a notifier: the debugchan sink
# above is at INFO for exactly that reason, and a channel is why
# "logger.cservice.sql = DEBUG" is commented out rather than shipped on.
#
# "logger.legacy = on" is every unconverted module's elog chatter - among
# it, ccontrol's own password UPDATE - sent to every sink the root has.  Keep
# it off on a production install, or on with a text file of its own and
# nowhere else.
#
# An irc sink is driven by whatever the uplink sends, one notice per anomaly,
# and has no rate limit unless "sink.<id>.rate" asks for one: put it on a
# module's own logger at WARN or above, not on core.state, core.proto, core.net
# or the root - or give it a rate.
#
# Pushover is a third party: only the rendered sentence ever leaves this host.
# It pages at ERROR and above unless this file says otherwise, sends at most
# 10/min, and holds a token - so chmod 600 this file.  See the pushover section
# above.
#
# This file is itself trusted input: a path it names is used exactly as
# given, and nothing here is checked against what an operator did not mean.
#
# What each kind of sink shows, most revealing first:
#   file, json       everything: every field, unredacted
#   file/console,    the sentence; a control character in it is escaped as
#   text             \xNN, every other byte of 0x80 and up passes through as
#                    text - read an untrusted log file with less or cat -v,
#                    not a terminal left to interpret whatever is in it
#   irc              the sentence, with every control character removed
#   notifier         the sentence, and nothing else
