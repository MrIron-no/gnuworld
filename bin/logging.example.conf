# GNUWorld logging configuration
#
# This file says WHERE log records are written (the sinks) and WHICH records
# each destination gets (the loggers).  Copy it to logging.conf in the
# directory GNUWorld is started from, or point the "logging_conf" key of
# GNUWorld.conf at it.
#
# The file is OPTIONAL.  With no logging.conf at all GNUWorld behaves as it
# always did: a human-readable debug.log plus, in verbose mode, the terminal.
#
# It is re-read on SIGHUP, together with the log rotation that signal does:
# every sink reopens its file, then this file is read again, so a change here
# takes effect without a restart.  A file that cannot be read or that has a
# mistake in it is reported as ERROR records on the logger "core.config" and
# then ignored: the configuration in force stays in force, and a broken file
# can neither stop nor silence a running process.
#
# GNUWorld does NOT rotate its own log files.  Rotation is external: let
# logrotate (or whatever else) move the files away and send GNUWorld a SIGHUP,
# and the next record lands in a fresh file.  A logrotate stanza is no more
# than
#
#   /path/to/gnuworld/*.log {
#       daily
#       rotate 14
#       compress
#       missingok
#       notifempty
#       sharedscripts
#       postrotate
#           kill -HUP $(cat /path/to/gnuworld/gnuworld.pid)
#       endscript
#   }
#
#################################################################
# Syntax
#
# The syntax is the usual "key = value" of every GNUWorld conf file; '#'
# starts a comment, and a comment has a line of its own.
#
#   sink.<id>.type      = file | console | irc
#                         What kind of destination this is.  Required.
#                         Other kinds exist that this file cannot name: a
#                         module attaches its pushover or prometheus sink in
#                         code.
#   sink.<id>.path      = <file name>
#                         file only, required.  Relative to the directory
#                         GNUWorld runs in, like every other file name.  The
#                         file is appended to, never truncated.
#   sink.<id>.format    = json | text
#                         file only: default json.  A console and a channel
#                         are read by a human and are always text.
#   sink.<id>.level     = OFF | FATAL | ERROR | WARN | INFO | DEBUG | TRACE
#                         The least important record this sink still writes.
#                         Default TRACE, which is everything it is given.
#   sink.<id>.colour    = auto | yes | no
#                         console only, default auto: colour when the output
#                         really is a terminal and NO_COLOR is not set.
#   sink.<id>.channel   = #channel
#                         irc only, required.  Records are sent there as
#                         server notices, and are dropped for as long as
#                         GNUWorld is not connected or the channel is empty.
#   sink.<id>.highlight = yes | no
#                         console and irc, default yes: the values
#                         substituted into a message are shown in bold.
#
#   logger.<dotted.name> = LEVEL[, <sink id>[, <sink id> ...]]
#                         The level this logger records at, and the sinks its
#                         records go to.  The root logger is written "root".
#   additivity.<dotted.name> = yes | no
#                         Default yes.  See below.
#
# An <id> is letters, digits, '_' and '-'.  Levels, sink types and yes/no
# values may be written in any case; a logger name is read exactly as spelt.
#
#################################################################
# Inheritance, additive sinks, and the threshold of a sink
#
# Logger names are a hierarchy: "cservice.sql" sits below "cservice", which
# sits below the root.  A logger with no level of its own has the level of the
# nearest ancestor that has one, so "logger.root = INFO" is the level of
# everything, and one line about one logger is enough to raise or lower that
# part of the tree.
#
# Sinks are ADDITIVE: a record logged on "cservice.sql" goes to the sinks of
# "cservice.sql", and then to those of "cservice", and then to those of the
# root.  "additivity.<name> = no" stops that walk after that logger, which is
# how one logger is sent to a file of its own and nowhere else.
#
# Each sink has a threshold of its own on top of all that: a logger at DEBUG
# feeding a sink at WARN writes the DEBUG records to its other sinks and only
# the warnings and worse to that one.
#
#################################################################
# The loggers there are
#
#   root            everything, the ancestor of all of the below
#   legacy          every line still written through the old elog stream
#   core            the server itself: xServer, main, the timers
#   core.net        the connection layer
#   core.proto      the protocol layer: one record per message is TRACE
#   core.state      the network state: clients, servers, channels
#   core.config     the configuration files, this one included
#   core.modules    loading, attaching and unloading modules
#
# and one logger per module, named after its library file - libcservice.la is
# "cservice" - which is the logger the module's own LOG statements write to:
#
#   cservice  ccontrol  chanfix  dronescan  nickserv  cloner  gnutest  ...
#
# Every module that talks to a database also has "<module>.sql" below it -
# cservice.sql, ccontrol.sql, chanfix.sql, dronescan.sql, nickserv.sql - whose
# code default is ERROR: failed queries are logged, successful ones are not.
# DEBUG on such a logger logs every query the module sends.
#
# cservice has one more of its own:
#
#   cservice.commands   one record per command a user sends; the sentence names
#                       the command and the nick, the arguments are in the JSON
#                       field command_line
#
#################################################################
# The two command line switches
#
# The sink id "debuglog" is special, because it is the file the -d and -D
# switches have always been about:
#
#   -d <file>   the sink with the id "debuglog" writes to <file> instead of
#               the path given here
#   -D          the sink with the id "debuglog" is removed altogether, and
#               with it every mention of it in a logger line - "no debug log"
#               keeps meaning no debug log
#
# Nothing else here is touched by the command line.  The terminal is written
# to only in verbose mode (-c), whether a console sink is configured or not.
#
#################################################################
# The configuration

# The terminal GNUWorld was started from, in verbose mode
sink.console.type = console

# The human-readable log file the -d and -D switches are about
sink.debuglog.type = file
sink.debuglog.path = debug.log
sink.debuglog.format = text

# One JSON record per line, for a log shipper to read
sink.main.type = file
sink.main.path = gnuworld.log
sink.main.format = json

# Everything at INFO and above, to all three
logger.root = INFO, debuglog, console, main

# The old elog stream, which has always been debug-level chatter
logger.legacy = DEBUG

# The server itself
logger.core = INFO

#################################################################
# Examples, for copying rather than for using as they stand

# A channel to mirror a log to.  The notices are sent as the server, so the
# channel needs no client in it; records logged while GNUWorld is not
# connected are dropped rather than queued for ever.
#sink.debugchan.type = irc
#sink.debugchan.channel = #coder-com
#sink.debugchan.level = INFO
#sink.debugchan.highlight = yes

# cservice at DEBUG, with its INFO records and worse also going to the channel
# above (DEBUG records reach it too, but the sink's own level drops them)
#logger.cservice = DEBUG, debugchan

# Every protocol message, which is a great deal of output
#logger.core.proto = TRACE

# Every SQL query cservice sends
#logger.cservice.sql = DEBUG

# Every command a user sends X, to a file of its own and to nowhere else: the
# sentence is safe to show anywhere, the JSON field command_line is not
#sink.commandlog.type = file
#sink.commandlog.path = cservice-commands.log
#sink.commandlog.format = json
#logger.cservice.commands = INFO, commandlog
#additivity.cservice.commands = no

# An audit trail of its own: one logger to one file, and nowhere else.  The
# "additivity = no" is what keeps these records out of the files above.
#sink.spamaudit.type = file
#sink.spamaudit.path = dronescan-spam.log
#sink.spamaudit.format = json
#logger.dronescan.spam.action = INFO, spamaudit
#additivity.dronescan.spam.action = no

#################################################################
# Modules that still configure their own logging
#
# A module whose own conf file has logging keys of its own - cservice, with
# log_verbosity, chan_verbosity, console_verbosity, log_sql and console_sql -
# keeps using them for as long as this file has no "logger.<module>" line for
# it.  Add such a line and the module's own keys are ignored, and the module
# says so in its log when it starts.
