# GNUWorld integration-test stack: Postgres + gnuworld runtime image.
#
# Gnuworld uses host networking so it can reach FakeHub on 127.0.0.1
# (pytest on the host) and Postgres on its published port.
# Stdout is still captured via `docker compose run --rm -T`.
#
# Reach it with gnuworld_proc.compose_cmd(): a bare `docker compose` here would
# name the project after this directory, which every checkout shares.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gnuworld
      POSTGRES_PASSWORD: gnuworld
      POSTGRES_DB: ccontrol
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      # The schema of mod.cservice is loaded from the repository's own files
      - ../../doc:/gnuworld-doc:ro
      - ../../mod.openchanfix/doc:/gnuworld-openchanfix-doc:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnuworld -d ccontrol"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      # No host port: Docker picks a free one, which the harness asks for with
      # `compose port` (gnuworld_proc.harness_sql_port) and writes into the
      # module configs. A fixed port here is shared by every checkout on the
      # machine, so two runs at once collide on it -- do not put one back.
      - "5432"

  gnuworld:
    build:
      context: ../..
      dockerfile: test/harness/docker/Dockerfile
    network_mode: host
    # Conf is bind-mounted per test via `compose run -v ...`
    profiles: ["run"]
