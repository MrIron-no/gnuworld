# Override for undernet-development-env/docker-compose.yml.
#
# Runs a second, isolated copy of the development stack against a P11 ircu
# checkout, so real P11 server-to-server traffic can be recorded as test
# fixtures. It is meant to coexist with other ircu stacks on the same host:
#   - its own compose project name (set by run.sh), so its own network/volumes
#   - its own image tags, so it never overwrites ircu2:latest / gnuworld:latest
#   - host ports moved to the 1xxxx range; ports nobody needs are not published
#   - gnuworld is built and run with mod.debug only, so no database is started
#
# "!override" replaces the base file's port list instead of appending to it
# (needs Docker Compose >= 2.24.4).
services:
  hub:
    image: ircu2:p11-harness
    ports: !override
      - "14400:4400"   # plaintext server port
      - "16669:6669"   # hidden client port

  leaf:
    image: ircu2:p11-harness
    ports: !override
      - "16667:6667"   # client port
      - "16697:6697"   # client port, TLS

  gnuworld:
    image: gnuworld:p11-harness
    build:
      # Generated by run.sh from the development environment's Dockerfile, with
      # --enable-modules=debug. The core is being overhauled and mod.debug is
      # the only module guaranteed to compile against it.
      dockerfile: ${P11_GEN_DIR:?set by run.sh}/Dockerfile.gnuworld
    # -l: write the decrypted inbound S2S stream to this file. Outbound lines
    # are on stdout as "[OUT]" (see `run.sh logs gnuworld`).
    command: ["-l", "/gnuworld/capture/socket.log"]
    volumes:
      # Same target as the base file's ./etc/gnuworld mount, so this replaces
      # it: a generated gnuworld.conf that loads mod.debug only.
      - ${P11_GEN_DIR}/etc:/gnuworld/etc
      - ${P11_CAPTURE_DIR:?set by run.sh}:/gnuworld/capture
    # mod.debug has no database, so drop the base file's wait on Postgres.
    depends_on: !override
      hub:
        condition: service_started
